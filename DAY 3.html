<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>enrollment form</title>
</head>
<body>
  <h1>STUDENT ENROLLMENT FORM</h1>
  <form>
  
  <label>  FIRST NAME :</label><br>
  <input type="text" name="username" required> <br><br>
    <label>  LAST NAME :</label><br>
  <input type="text" name="username" required><br><br>

  <label> E-MAIL :</label><br>
  <input type="email" name="email" required><br><br>

  <label> PASSWORD :</label><br>

  <input type="password" name="password" required><br><br>

  <label> AGE :</label><br>
<input type="number" name="age" required><br><br>

<label> DOB :</label><br>
<input type="date" name="date of birth" required><br><br>

<label> GENDER :</label><br>
<input type="radio" name="gender" value="male" required> Male 
<input type="radio" name="gender" value="female" required> Female
<input type="radio" name="gender" value="other" required> Other <br><br>

<label>SKILL LEVEL :</label><br>
<input type="range" name="skills" min="0" max="10"><br><br>

<Label> COURSES :</Label><br>
<select>
  <option>HTML</option>
   <option>CSS</option>
    <option>JAVASCRIPT</option> 
</select><br><br>


<label>HOBBIES :</label><br>
<input type="checkbox" name="hobbies" value="music"> Music 
<input type="checkbox" name="hobbies" value="reading"> Reading
<input type="checkbox" name="hobbies" value="playing"> Playing <br><br>

<label>UPLOAD IMAGE :</label><br>
<input type="file" name="photo"><br><br>

<label> FAVOURATE COLOR :</label><br>
<input type="color" name="color"><br><br>

<input type="submit" value="SUBMIT">

</form>
  
</body>
</html>
